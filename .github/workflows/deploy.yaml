name: Build Docker images

on:
  push:
    branches: ["main", "dev"]

jobs:
  build-and-push-dockerfile-image:
    if: startsWith(github.repository, 'Inkubator-IT/template-') == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push (staging)
        if: github.ref_name == 'dev'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            inkubatorit/website-iit:staging
          platforms: linux/amd64

      - name: Build and Push (main)
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            inkubatorit/website-iit:latest
          platforms: linux/amd64

      - name: Trigger Coolify redeploy (staging)
        if: github.ref_name == 'dev'
        run: |
          curl -X POST '${{ secrets.COOLIFY_DEPLOY_WEBHOOK_STAGING }}' \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify redeploy (main)
        if: github.ref_name == 'main'
        run: |
          curl -X POST '${{ secrets.COOLIFY_DEPLOY_WEBHOOK_MAIN }}' \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
